server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API do 1001 Albums Generator
    location /api-1001/ {
        proxy_pass https://1001albumsgenerator.com/api/v1/projects/;
        proxy_ssl_server_name on;
        proxy_set_header Host 1001albumsgenerator.com;
    }

    # SPA Fallback: rotas desconhecidas servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de arquivos estáticos
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}