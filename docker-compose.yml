services:
  mosaic-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mosaic-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web_network

  mosaic-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mosaic-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - web_network

networks:
  web_network:
    external: true